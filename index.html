<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Sourse/style/style.css">
    <link rel="shortcut icon" href="Sourse/ico/Agregar-un-título.ico" type="image/x-icon">
    <title>Portofio</title>
</head>
<body>
    <header class="header_raiz">
        <div class="div_container_logo div_center">
            <div class="div_logo div_center">
                    <span><a href="index.html">Lautaro</a></span>                
            </div>
        </div>
    </header>
    <main class="main_index div_center">
        <article class="article_sections_main div_center">
            <section class="section_articles_menu section_izquierda">
                <button id="about_me">Sobre mi</button>
            </section>
            <section class="section_articles_menu section_izquierda">
                <button id="studies">Estudios</button>
            </section>
        </article>
        <article class="article_main div_center" id="article_container">
            <section class="section_contact div_center">
                <h1>Contacto</h1>
                <section class="form_main div_center">

                    <form method="post" id="form" name="form" action="/send-email" class="div_center">
                        <label for="name">Nombre: </label>
                        <input type="text" id="name" name="name" required>
                        
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="message">Mensaje: </label>
                    <textarea name="message" id="message" required></textarea>
                    
                    <button type="submit" id="send_email">Enviar</button>
                </form>
            </section>
            <section class="contacts_main div_center">
                <h2>Redes</h2>
                <div class="div_container_contacts div_center">
                    <a class="contact_tag div_center" href="#">
                        <img src="./Sourse/ico/github-brands.svg" alt="Icono de github">
                    </a>
                    <a class="contact_tag div_center" href="https://www.linkedin.com/in/lautarofonsecatecch/">
                        <img src="./Sourse/ico/linkedin-brands.svg" alt="Icono de linkedin">
                    </a>   
                </div>
            </section>
        </section>
        </article>
        <article class="article_sections_main div_center">
            <section class="section_articles_menu section_derecha">
                <button id="proyects">Proyectos</button>
            </section>
            <section class="section_articles_menu section_derecha">
                <button id="contact">Contactos</button>
            </section>
        </article>
    </main>
    <footer class="footer_raiz div_center">
        <div class="div_container_footer div_center">
            <span><a href="index.html">Lautaro Fonseca Tecchio</a></span>
        </div>
    </footer>
    <script type="module" src="./Sourse/js/index.js"></script>
</body>
</html>
